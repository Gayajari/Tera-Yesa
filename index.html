<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tera Yesa</title>
<link rel="stylesheet" href="css/style.css" />
<style>
/* ============================================================
   Style khusus desain halaman ini.
   Class/id di sini tidak bentrok dengan css/style.css,
   yang tetap dipakai untuk #pageLoader & .spinner (loading system).
   ============================================================ */

html, body{
  height:100%;
}

body{
  font-family:"Segoe UI", Arial, sans-serif;
  margin:0;
  background:#fff;
  color:#111;
}

h1{
  font-size:36px;
  font-weight:700;
}

.site-header{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  margin:15px 0;
}
.site-header img{
  width:42px;
  height:42px;
  border-radius:8px;
}
.site-header h1{
  margin:0;
  font-size:24px;
}

.page-wrap{
  max-width:640px;
  min-height:100vh;
  margin:0 auto;
  padding:0 16px 40px;
  text-align:center;
  display:flex;
  flex-direction:column;
}

.section-title{
  margin-bottom:5px;
}

/* Section Play Now & Join Telegram/WhatsApp: rata kiri */
.left-block{
  text-align:left;
}
.left-block .section-title{
  text-align:left;
}

/* Bagian footer + copyright didorong mentok ke bawah halaman */
.page-footer{
  margin-top:auto;
}

.play-link{
  display:inline-block;
  font-size:28px;
  text-decoration:none;
  transition:transform 0.2s ease;
}
.play-link:hover,
.play-link:active{
  transform:scale(1.15);
}

.contact-row{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:6px;
}

.contact-chip{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:10px 18px;
  border-radius:999px;
  font-size:14px;
  font-weight:600;
  color:#fff;
  text-decoration:none;
  box-shadow:0 3px 10px rgba(0,0,0,0.15);
  transition:transform 0.2s ease, box-shadow 0.2s ease;
}
.contact-chip:hover,
.contact-chip:active{
  transform:translateY(-2px) scale(1.03);
  box-shadow:0 6px 16px rgba(0,0,0,0.22);
}
.contact-chip__icon{
  font-size:16px;
  line-height:1;
}

.contact-chip--telegram{ background:linear-gradient(135deg,#2AABEE,#229ED9); }
.contact-chip--whatsapp{ background:linear-gradient(135deg,#25D366,#1DA851); }
.contact-chip--kontak{ background:linear-gradient(135deg,#ff9a3c,#ff5e3a); }

#foto1Img,
#foto2Img{
    width:100%;
    height:auto;
    display:block;
    margin-bottom:10px;
    border-radius:8px;
}

.gallery{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:5px;
}

.gallery img{
    width:100%;
    height:auto;
    display:block;
    border-radius: 8px;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
}

.gallery img:hover,
.gallery img:active {
  transform: scale(1.03);
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}

.site-footer{
  background:#358;
  color:#fff;
  padding:15px;
  text-align:center;
  margin-top:20px;
}

.copyright{
  text-align:center;
  font-size:13px;
  color:#666;
}

/* ------------------------------------------------------------
   Responsif: tablet, laptop, PC, dan mode desktop
   Layout dasar tetap 1 kolom (mobile-first), lalu melebar
   dan menyesuaikan untuk layar yang lebih besar.
   ------------------------------------------------------------ */

/* Tablet ke atas (>=600px) */
@media (min-width: 600px) {
  .page-wrap{
    max-width: 760px;
    padding: 0 24px 48px;
  }
  h1{
    font-size: 40px;
  }
  .play-link{
    font-size: 32px;
  }
  .foto-section{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  #foto1Img,
  #foto2Img{
    margin-bottom: 0;
    height: 100%;
    object-fit: cover;
    aspect-ratio: 4 / 3;
  }
  .gallery{
    gap: 12px;
  }
}

/* Laptop / PC / mode desktop (>=1024px) */
@media (min-width: 1024px) {
  .page-wrap{
    max-width: 960px;
    padding: 0 32px 64px;
  }
  .site-header img{
    width: 56px;
    height: 56px;
  }
  .site-header h1{
    font-size: 30px;
  }
  h1{
    font-size: 46px;
  }
  .play-link{
    font-size: 36px;
  }
  .contact-chip{
    font-size: 15px;
    padding: 12px 22px;
  }
  .gallery{
    gap: 16px;
  }
}

/* Layar sangat lebar (>=1440px), misalnya monitor PC besar */
@media (min-width: 1440px) {
  .page-wrap{
    max-width: 1080px;
  }
}
</style>
</head>

<body>
  <!-- Loader tampil sampai data Firestore selesai dimuat (dikendalikan oleh js/app.js) -->
  <div id="pageLoader" class="page-loader">
    <div class="spinner"></div>
  </div>

  <div id="mainContent" class="page-wrap">

    <div class="site-header">
      <img src="https://i.ibb.co.com/XkX0Hd5h/unnamed.png" alt="Logo Tera Yesa">
      <h1>Tera Yesa</h1>
    </div>

    <div class="left-block">
      <h2 class="section-title">Play Now</h2>
      <p>⬇️⬇️⬇️</p>

      <a id="play1Btn" class="play-link" href="#" target="_blank" rel="noopener noreferrer">▶️</a>
      <br><br>
      <a id="play2Btn" class="play-link" href="#" target="_blank" rel="noopener noreferrer">▶️</a>
      <br><br>
      <a id="play3Btn" class="play-link" href="#" target="_blank" rel="noopener noreferrer">▶️</a>

      <h2 class="section-title" style="margin-top:24px;">Join &amp; Kontak Kami</h2>
      <p>⬇️⬇️⬇️</p>

      <div class="contact-row">
        <a id="telegramBtn" class="contact-chip contact-chip--telegram" href="#" target="_blank" rel="noopener noreferrer">
          <span class="contact-chip__icon">📨</span> Telegram
        </a>
        <a id="whatsappBtn" class="contact-chip contact-chip--whatsapp" href="#" target="_blank" rel="noopener noreferrer">
          <span class="contact-chip__icon">💬</span> WhatsApp
        </a>
        <a id="kontakBtn" class="contact-chip contact-chip--kontak" href="#" target="_blank" rel="noopener noreferrer">
          <span class="contact-chip__icon">📞</span> Kontak
        </a>
      </div>
    </div>

    <br><br>

    <div class="foto-section">
      <a id="foto1Link" href="#" target="_blank" rel="noopener noreferrer">
        <img id="foto1Img" src="assets/placeholder.png" alt="Foto 1" loading="lazy">
      </a>

      <a id="foto2Link" href="#" target="_blank" rel="noopener noreferrer">
        <img id="foto2Img" src="assets/placeholder.png" alt="Foto 2" loading="lazy">
      </a>
    </div>

    <div class="gallery">
      <a id="galeri1Link" href="#" target="_blank" rel="noopener noreferrer">
        <img id="galeri1Img" src="assets/placeholder.png" alt="Galeri 1" loading="lazy">
      </a>
      <a id="galeri2Link" href="#" target="_blank" rel="noopener noreferrer">
        <img id="galeri2Img" src="assets/placeholder.png" alt="Galeri 2" loading="lazy">
      </a>
      <a id="galeri3Link" href="#" target="_blank" rel="noopener noreferrer">
        <img id="galeri3Img" src="assets/placeholder.png" alt="Galeri 3" loading="lazy">
      </a>
    </div>

    <div class="page-footer">
      <hr>
      <div class="site-footer">
        @Tera_Yesa<br>
        Thanks for coming !!!
      </div>

      <p class="copyright">
        ©2026 since<br>
        All Rights Reserved.
      </p>
    </div>

  </div>

  <!-- Seluruh logika ambil & gabung data Firestore ada di js/app.js,
       yang membaca konfigurasi dari js/firebase.js (bukan inline di sini). -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
