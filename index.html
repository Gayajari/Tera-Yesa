<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tera Yesa</title>
<link rel="stylesheet" href="css/style.css" />
<style>
/* ============================================================
   Style khusus desain halaman ini.
   Class/id di sini tidak bentrok dengan css/style.css,
   yang tetap dipakai untuk #pageLoader & .spinner (loading system).
   Palet: biru toska yang teduh (tidak terlalu terang/mencolok).
   ============================================================ */

:root{
  --brand-accent:#1f7a94;
  --brand-accent-soft:#2f97b3;
  --brand-deep:#134f61;
  --brand-text:#20202b;
  --brand-text-muted:#6b6f7d;
  --radius-lg:20px;
  --radius-md:14px;
  --shadow-soft:0 10px 30px rgba(20,45,55,0.08);
  --shadow-hover:0 14px 34px rgba(20,45,55,0.14);

  /* Warna khusus footer: toska/telur bebek, tetap kontras dari card putih tapi selaras brand */
  --footer-accent-a:#6fd3c6;
  --footer-accent-b:#1a6f88;
}

html, body{
  height:100%;
}

body{
  font-family:"Segoe UI", Arial, sans-serif;
  margin:0;
  color:var(--brand-text);
  background:
    radial-gradient(circle at 12% 0%, rgba(31,122,148,0.10), transparent 45%),
    radial-gradient(circle at 90% 15%, rgba(31,122,148,0.08), transparent 40%),
    #fbfbfe;
  background-attachment:fixed;
}

h1{
  font-size:34px;
  font-weight:800;
  letter-spacing:-0.5px;
}

@keyframes riseIn{
  from{ opacity:0; transform:translateY(14px); }
  to{ opacity:1; transform:translateY(0); }
}
.fade-in{
  animation:riseIn 0.6s cubic-bezier(0.22,1,0.36,1) both;
}
.fade-in-1{ animation-delay:0.05s; }
.fade-in-2{ animation-delay:0.15s; }
.fade-in-3{ animation-delay:0.25s; }
.fade-in-4{ animation-delay:0.35s; }
.fade-in-5{ animation-delay:0.45s; }

.site-header{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:2px;
  margin:26px 0 30px;
}
.site-header img{
  width:56px;
  height:56px;
  border-radius:14px;
  box-shadow:var(--shadow-soft);
}
.site-header h1{
  margin:0;
  font-size:24px;
}
.site-header__tagline{
  display:block;
  font-size:12.5px;
  font-weight:500;
  color:var(--brand-text-muted);
  margin-top:2px;
  margin-left:14px; /* geser ke kanan, sesuaikan angka ini sesuai selera */
}

.page-wrap{
  max-width:640px;
  min-height:100vh;
  margin:0 auto;
  padding:0 16px 14px;
  text-align:center;
  display:flex;
  flex-direction:column;
}

.content-card{
  background:#ffffff;
  border-radius:var(--radius-lg);
  padding:28px 20px 32px;
  box-shadow:var(--shadow-soft);
  border:1px solid rgba(20,45,55,0.05);
}

.section-block + .section-block{
  margin-top:26px;
  padding-top:22px;
  border-top:1px dashed rgba(20,45,55,0.12);
}

.section-title{
  margin:0 0 2px;
  font-size:16px;
  font-weight:600;
  color:var(--brand-text);
}
.section-arrow{
  margin:0 0 12px;
  font-size:20px;
  opacity:0.75;
}

.left-block{
  text-align:left;
}
.left-block .section-title,
.left-block .section-arrow{
  text-align:left;
}

.page-footer{
  margin-top:auto;
  padding-top:18px;
}

.play-list{
  display:flex;
  flex-direction:column;
  gap:14px;
}
.play-link{
  display:inline-block;
  font-size:30px;
  line-height:1;
  text-decoration:none;
  transition:transform 0.2s ease;
}
.play-link:hover,
.play-link:active{
  transform:scale(1.15);
}

.contact-row{
  display:flex;
  flex-wrap:nowrap;
  gap:6px;
  margin-top:10px;
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  padding-bottom:2px;
}
.contact-row::-webkit-scrollbar{
  display:none;
}

.contact-chip{
  flex:1 1 auto;
  min-width:-webkit-max-content;
  min-width:max-content;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:5px;
  padding:9px 14px;
  border-radius:14px;
  font-size:12px;
  font-weight:600;
  color:#fff;
  text-decoration:none;
  white-space:nowrap;
  box-shadow:0 4px 12px rgba(20,45,55,0.14);
  transition:transform 0.2s ease, box-shadow 0.2s ease;
}
.contact-chip:hover,
.contact-chip:active{
  transform:translateY(-2px) scale(1.02);
  box-shadow:0 8px 18px rgba(20,45,55,0.2);
}
.contact-chip__icon{
  font-size:13px;
  line-height:1;
  flex-shrink:0;
}

.contact-chip--telegram{ background:linear-gradient(135deg,#2AABEE,#1f8fc9); }
.contact-chip--whatsapp{ background:linear-gradient(135deg,#12a4a0,#0d8a86); }
.contact-chip--kontak{ background:linear-gradient(135deg,#3468a4,#24507e); }
.contact-chip--discord{ background:linear-gradient(135deg,#5865F2,#3d47c9); }

#foto1Img,
#foto2Img{
    width:100%;
    height:auto;
    display:block;
    margin-bottom:10px;
    border-radius:var(--radius-md);
}

.foto-section a{
  display:block;
  border-radius:var(--radius-md);
  overflow:hidden;
  box-shadow:var(--shadow-soft);
  transition:transform 0.3s ease, box-shadow 0.3s ease;
}
.foto-section a:hover,
.foto-section a:active{
  transform:translateY(-3px);
  box-shadow:var(--shadow-hover);
}

.gallery{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
}

.gallery a{
  display:block;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 4px 12px rgba(20,45,55,0.08);
}

.gallery img{
    width:100%;
    height:auto;
    display:block;
    border-radius:12px;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.gallery a:hover img,
.gallery a:active img {
  transform: scale(1.06);
}

.site-footer{
  position:relative;
  overflow:hidden;
  background:linear-gradient(135deg, var(--footer-accent-a), var(--footer-accent-b));
  color:#fff;
  padding:13px 18px 14px;
  border-radius:16px 6px 16px 6px;
  box-shadow:0 8px 18px rgba(26,111,136,0.22);
}
.site-footer::before{
  content:"";
  position:absolute;
  width:90px;
  height:90px;
  top:-36px;
  right:-24px;
  background:rgba(255,255,255,0.14);
  border-radius:50%;
}
.site-footer__handle{
  position:relative;
  font-size:13px;
  font-weight:800;
  letter-spacing:1px;
  text-transform:uppercase;
  margin-bottom:2px;
  text-shadow:0 1px 6px rgba(0,0,0,0.15);
}
.site-footer__tagline{
  position:relative;
  font-size:11.5px;
  font-weight:500;
  opacity:0.95;
}

.copyright{
  text-align:center;
  font-size:12px;
  color:var(--brand-text-muted);
  margin-top:12px;
  padding:8px 12px;
  background:rgba(31,122,148,0.07);
  border-radius:999px;
}

/* Slot iklan (iframe sandboxed) */
.ads-native-slot{
  display:flex;
  flex-direction:column;
  align-items:center;
  overflow:hidden;
}
.ads-native-slot iframe{
  border:none;
  display:block;
  max-width:100%;
}

@media (min-width: 600px) {
  .page-wrap{
    max-width: 760px;
    padding: 0 24px 18px;
  }
  .content-card{
    padding:36px 32px 40px;
  }
  h1{
    font-size: 38px;
  }
  .play-link{
    font-size: 32px;
  }
  .section-arrow{
    font-size:22px;
  }
  .contact-chip{
    font-size:13px;
    padding:11px 8px;
    gap:5px;
  }
  .contact-chip__icon{
    font-size:14px;
  }
  .foto-section{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  #foto1Img,
  #foto2Img{
    margin-bottom: 0;
    height: 100%;
    object-fit: cover;
    aspect-ratio: 4 / 3;
  }
  .gallery{
    gap: 12px;
  }
}

@media (min-width: 1024px) {
  .page-wrap{
    max-width: 960px;
    padding: 0 32px 22px;
  }
  .content-card{
    padding:44px 48px 48px;
  }
  .site-header img{
    width: 64px;
    height: 64px;
  }
  .site-header h1{
    font-size: 30px;
  }
  h1{
    font-size: 44px;
  }
  .play-link{
    font-size: 34px;
  }
  .section-arrow{
    font-size:24px;
  }
  .contact-chip{
    font-size: 14px;
    padding: 12px 14px;
  }
  .gallery{
    gap: 16px;
  }
}

@media (min-width: 1440px) {
  .page-wrap{
    max-width: 1080px;
  }
}

@media (max-width: 340px) {
  .contact-chip{
    font-size:9.5px;
    padding:8px 2px;
    gap:2px;
  }
  .contact-chip__icon{
    font-size:11px;
  }
}
</style>
</head>

<body>
  <div id="pageLoader" class="page-loader">
    <div class="spinner"></div>
  </div>

  <div id="mainContent" class="page-wrap">

    <div class="site-header fade-in fade-in-1">
      <img src="https://i.ibb.co.com/XkX0Hd5h/unnamed.png" alt="Logo Tera Yesa">
      <div>
        <h1>Tera Yesa</h1>
        <span class="site-header__tagline">Selamat datang 👋</span>
      </div>
    </div>

    <div class="content-card fade-in fade-in-2">

      <div class="section-block left-block">
        <h2 class="section-title">Play Now</h2>
        <p class="section-arrow">⬇️⬇️⬇️</p>

        <div class="play-list">
          <a id="play1Btn" class="play-link" href="#" target="_blank" rel="noopener noreferrer">▶️</a>
          <a id="play2Btn" class="play-link" href="#" target="_blank" rel="noopener noreferrer">▶️</a>
          <a id="play3Btn" class="play-link" href="#" target="_blank" rel="noopener noreferrer">▶️</a>
        </div>
      </div>

      <div class="section-block">
        <!-- Banner 320x50, dibungkus iframe sandbox lewat script di bawah -->
        <div class="ads-native-slot" id="adsSlotLeaderboard"></div>
      </div>

      <div class="section-block left-block" id="joinKontakSection">
        <h2 class="section-title">Join &amp; Kontak Kami</h2>
        <p class="section-arrow">⬇️⬇️⬇️</p>

        <div class="contact-row">
          <a id="telegramBtn" class="contact-chip contact-chip--telegram" href="#" target="_blank" rel="noopener noreferrer">
            <span class="contact-chip__icon">📨</span> Telegram
          </a>
          <a id="whatsappBtn" class="contact-chip contact-chip--whatsapp" href="#" target="_blank" rel="noopener noreferrer">
            <span class="contact-chip__icon">👀</span> Cara nonton
          </a>
          <a id="kontakBtn" class="contact-chip contact-chip--kontak" href="#" target="_blank" rel="noopener noreferrer">
            <span class="contact-chip__icon">📎</span> Download terabox
          </a>
          <a id="discordBtn" class="contact-chip contact-chip--discord" href="#" target="_blank" rel="noopener noreferrer">
            <span class="contact-chip__icon">🫂</span> Join vip 50k no ribet
          </a>
        </div>
      </div>

      <div class="section-block fade-in fade-in-3">
        <div class="foto-section">
          <a id="foto1Link" href="#" target="_blank" rel="noopener noreferrer">
            <img id="foto1Img" src="assets/placeholder.png" alt="Foto 1" loading="lazy">
          </a>

          <a id="foto2Link" href="#" target="_blank" rel="noopener noreferrer">
            <img id="foto2Img" src="assets/placeholder.png" alt="Foto 2" loading="lazy">
          </a>
        </div>
      </div>

      <div class="section-block fade-in fade-in-4">
        <div class="gallery">
          <a id="galeri1Link" href="#" target="_blank" rel="noopener noreferrer">
            <img id="galeri1Img" src="assets/placeholder.png" alt="Galeri 1" loading="lazy">
          </a>
          <a id="galeri2Link" href="#" target="_blank" rel="noopener noreferrer">
            <img id="galeri2Img" src="assets/placeholder.png" alt="Galeri 2" loading="lazy">
          </a>
          <a id="galeri3Link" href="#" target="_blank" rel="noopener noreferrer">
            <img id="galeri3Img" src="assets/placeholder.png" alt="Galeri 3" loading="lazy">
          </a>
        </div>
      </div>

      <div class="section-block">
        <!-- Banner 300x250, dibungkus iframe sandbox lewat script di bawah -->
        <div class="ads-native-slot" id="adsSlotSquare"></div>
      </div>

    </div>

    <div class="page-footer fade-in fade-in-5">
      <div class="site-footer">
        <div class="site-footer__handle">@Tera_Yesa</div>
        <div class="site-footer__tagline">Thanks for coming !!!</div>
      </div>

      <p class="copyright">
        ©2026 since<br>
        All Rights Reserved.
      </p>
    </div>

  </div>

  <script type="module" src="js/app.js"></script>

  <!-- ============================================================
       Slot iklan banner (320x50 & 300x250), dibungkus iframe sandbox:
       iklan tetap tampil & lapor impresi normal, tapi TIDAK BISA
       memicu redirect/tab baru otomatis tanpa klik manual pengunjung.
       ============================================================ -->
  <script>
    (function () {
      const ADS_ZONE_LEADERBOARD = { key: "bf543a6e7454727b54d70a67993cf089", width: 320, height: 50 };
      const ADS_ZONE_SQUARE = { key: "c16364636b098d12b5d1dc1a7b2ee614", width: 300, height: 250 };

      function buildAdsIframe(zone) {
        const iframe = document.createElement("iframe");
        iframe.width = String(zone.width);
        iframe.height = String(zone.height);
        iframe.scrolling = "no";
        iframe.loading = "lazy";
        iframe.sandbox = "allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation";
        iframe.srcdoc = `<!DOCTYPE html><html><head><meta charset="UTF-8"><style>body{margin:0;display:flex;align-items:center;justify-content:center;overflow:hidden;}</style></head><body>
          <script>
            atOptions = { 'key': '${zone.key}', 'format': 'iframe', 'height': ${zone.height}, 'width': ${zone.width}, 'params': {} };
          <\/script>
          <script src="https://inputoppose.com/${zone.key}/invoke.js"><\/script>
        </body></html>`;
        return iframe;
      }

      document.getElementById("adsSlotLeaderboard").appendChild(buildAdsIframe(ADS_ZONE_LEADERBOARD));
      document.getElementById("adsSlotSquare").appendChild(buildAdsIframe(ADS_ZONE_SQUARE));
    })();
  </script>

  <!-- ============================================================
       DINONAKTIFKAN: Adsterra Social Bar.
       Jenis iklan ini (bukan atOptions banner) biasanya menempel
       event listener ke seluruh <body> dan bisa memicu iklan
       fullscreen/redirect otomatis begitu halaman dibuka -- persis
       gejala "iklan selayar" yang ingin dihindari. Aktifkan lagi
       hanya jika kamu memang sudah putuskan menerima risiko itu.

       <script src="https://inputoppose.com/cc/fb/7a/ccfb7ac8b8913b26f3d38e0c3761d7c8.js"></script>
       ============================================================ -->
</body>
</html>
