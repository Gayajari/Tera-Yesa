<style>
/* ============================================================
   Style khusus desain halaman ini.
   Class/id di sini tidak bentrok dengan css/style.css,
   yang tetap dipakai untuk #pageLoader & .spinner (loading system).
   ============================================================ */

html, body{
  height:100%;
}

body{
  font-family:"Segoe UI", Arial, sans-serif;
  margin:0;
  background:#fff;
  color:#111;
}

h1{
  font-size:36px;
  font-weight:700;
}

.site-header{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  margin:15px 0;
}
.site-header img{
  width:42px;
  height:42px;
  border-radius:8px;
}
.site-header h1{
  margin:0;
  font-size:24px;
}

.page-wrap{
  max-width:640px;
  min-height:100vh;
  margin:0 auto;
  padding:0 16px 40px;
  text-align:center;
  display:flex;
  flex-direction:column;
}

.section-title{
  margin-bottom:5px;
}

/* Section Play Now & Join Telegram/WhatsApp: rata kiri */
.left-block{
  text-align:left;
}
.left-block .section-title{
  text-align:left;
}

/* Bagian footer + copyright didorong mentok ke bawah halaman */
.page-footer{
  margin-top:auto;
}

.play-link{
  display:inline-block;
  font-size:28px;
  text-decoration:none;
  transition:transform 0.2s ease;
}
.play-link:hover,
.play-link:active{
  transform:scale(1.15);
}

.text-link{
  display:inline-block;
  margin:4px 0;
}

#foto1Img,
#foto2Img{
    width:100%;
    height:auto;
    display:block;
    margin-bottom:10px;
    border-radius:8px;
}

.gallery{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:5px;
}

.gallery img{
    width:100%;
    height:auto;
    display:block;
    border-radius: 8px;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
}

.gallery img:hover,
.gallery img:active {
  transform: scale(1.03);
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}

.site-footer{
  background:#358;
  color:#fff;
  padding:15px;
  text-align:center;
  margin-top:20px;
}

.copyright{
  text-align:center;
  font-size:13px;
  color:#666;
}

/* ------------------------------------------------------------
   Responsif: tablet, laptop, PC, dan mode desktop
   Layout dasar tetap 1 kolom (mobile-first), lalu melebar
   dan menyesuaikan untuk layar yang lebih besar.
   ------------------------------------------------------------ */

/* Tablet ke atas (>=600px) */
@media (min-width: 600px) {
  .page-wrap{
    max-width: 760px;
    padding: 0 24px 48px;
  }
  h1{
    font-size: 40px;
  }
  .play-link{
    font-size: 32px;
  }
  .foto-section{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  #foto1Img,
  #foto2Img{
    margin-bottom: 0;
    height: 100%;
    object-fit: cover;
    aspect-ratio: 4 / 3;
  }
  .gallery{
    gap: 12px;
  }
}

/* Laptop / PC / mode desktop (>=1024px) */
@media (min-width: 1024px) {
  .page-wrap{
    max-width: 960px;
    padding: 0 32px 64px;
  }
  .site-header img{
    width: 56px;
    height: 56px;
  }
  .site-header h1{
    font-size: 30px;
  }
  h1{
    font-size: 46px;
  }
  .play-link{
    font-size: 36px;
  }
  .text-link{
    font-size: 17px;
  }
  .gallery{
    gap: 16px;
  }
}
/* Layar sangat lebar (>=1440px), misalnya monitor PC besar */
@media (min-width: 1440px) {
  .page-wrap{
    max-width: 1080px;
  }
}
   .ads-banner {
  text-align: center;
  margin: 8px 0;
   }
</style>
</head>
